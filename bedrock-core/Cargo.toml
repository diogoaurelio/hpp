[package]
name = "bedrock-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
shared = { path = "../shared" }
s3-core = { path = "../s3-core" }
async-trait = "0.1"

# Hugging Face integration (always available, enabled at runtime)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
hf-hub = "0.4"
tokenizers = "0.22"

# Alternative: ONNX Runtime
# ort = "1.16"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
futures = "0.3"

[features]
testing = ["shared/testing"]
# huggingface feature removed - now controlled at runtime via environment variables